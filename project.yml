name: ProbablySudoku
options:
  bundleIdPrefix: com.numberclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release
  Production: release

schemes:
  ProbablySudoku:
    build:
      targets:
        ProbablySudoku: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuTests
    profile:
      config: Release
    archive:
      config: Release
  ProbablySudoku-Production:
    build:
      targets:
        ProbablySudoku: all
    # Local runs/profiling use demo ads. Only the explicit archive is live.
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuTests
    profile:
      config: Release
    archive:
      config: Production
  ProbablySudoku-AppStore:
    build:
      targets:
        ProbablySudoku: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuTests
    profile:
      config: Release
    archive:
      config: Production
  ProbablySudoku-AdFree:
    # Retained SDK-free rollback; not the rewarded-ad App Store archive.
    build:
      targets:
        ProbablySudokuAppStore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuAppStoreTests
    profile:
      config: Production
    archive:
      config: Production

packages:
  ProbablySudokuEngine:
    path: Engine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

targetTemplates:
  AppBase:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # Generated target-specific plists are metadata, never resources.
          - "Info*.plist"
      - path: Artwork/studio-logo-horizontal.png
        buildPhase: resources
    entitlements:
      path: App/ProbablySudoku.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    dependencies:
      - package: ProbablySudokuEngine
    info:
      path: App/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: Probably Sudoku
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this iOS holds the app at 60Hz on a ProMotion phone.
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keep the existing portrait-only game layout in iPad compatibility mode.
        UIRequiresFullScreen: true
        # The app uses Apple GameKit/iCloud services, with no custom encryption.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app
        # Both editions compile the same source module and shared test suite.
        PRODUCT_MODULE_NAME: ProbablySudoku
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "11"
        DEVELOPMENT_TEAM: 233268ZQDV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TestsBase:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

targets:
  ProbablySudoku:
    templates: [AppBase]
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: App/Info.plist
      properties:
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NumberClubAdMode: $(ADMOB_MODE)
        NumberClubRewardedAdUnitID: $(ADMOB_REWARDED_ID)
        # Google iOS quick-start list, verified 2026-09-06. SKAdNetwork
        # attribution does not require an ATT prompt or access to IDFA.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
