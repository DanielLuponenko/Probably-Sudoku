name: ProbablySudoku
options:
  bundleIdPrefix: com.numberclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ProbablySudokuEngine:
    path: Engine

targets:
  ProbablySudoku:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Artwork/studio-logo-horizontal.png
        buildPhase: resources
    entitlements:
      path: App/ProbablySudoku.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    dependencies:
      - package: ProbablySudokuEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Probably Sudoku
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this iOS holds the app at 60Hz on a ProMotion phone.
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: 233268ZQDV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ProbablySudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: ProbablySudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
