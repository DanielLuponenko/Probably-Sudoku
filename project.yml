name: ProbablySudoku
options:
  bundleIdPrefix: com.numberclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ProbablySudokuEngine:
    path: Engine

targets:
  ProbablySudoku:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ProbablySudokuEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Probably Sudoku
        # Without this iOS holds the app at 60Hz on a ProMotion phone.
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 233268ZQDV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
