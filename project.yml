    settings:
      base:
        # Routine Debug/Release builds (including their TestFlight archives)
        # use demo IDs. Production TestFlight testers must be registered test
        # devices in AdMob before testing; its archive contains real IDs.
        ADMOB_MODE: test
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
      configs:
        Production:
          ADMOB_MODE: live
          ADMOB_APP_ID: ca-app-pub-6970700553304979~2878649005
          ADMOB_REWARDED_ID: ca-app-pub-6970700553304979/5201560013
          # Even a Production-config simulator build stays entirely on demo IDs.
          "ADMOB_MODE[sdk=iphonesimulator*]": test
          "ADMOB_APP_ID[sdk=iphonesimulator*]": ca-app-pub-3940256099942544~1458002511
          "ADMOB_REWARDED_ID[sdk=iphonesimulator*]": ca-app-pub-3940256099942544/1712485313
  ProbablySudokuAppStore:
    templates: [AppBase]
    # No Google package dependencies, frameworks, or privacy manifests. The
    # explicit compiler flag also excludes SDK code even if modules are visible.
    info:
      path: App/Info-AppStore.plist
      properties:
        NumberClubAdMode: disabled
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NUMBERCLUB_AD_FREE"
  ProbablySudokuTests:
    templates: [TestsBase]
    dependencies:
      - target: ProbablySudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app.tests
  ProbablySudokuAppStoreTests:
    templates: [TestsBase]
    dependencies:
      - target: ProbablySudokuAppStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app.appstore-tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NUMBERCLUB_AD_FREE"
