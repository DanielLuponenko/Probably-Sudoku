name: NumberClub
options:
  bundleIdPrefix: com.numberclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NumberClubEngine:
    path: Engine

targets:
  NumberClub:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NumberClubEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # Portrait only: the book is a portrait object.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Number Club
