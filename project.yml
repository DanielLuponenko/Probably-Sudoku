name: ProbablySudoku
options:
  bundleIdPrefix: com.numberclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release
  Production: release

schemes:
  ProbablySudoku:
    build:
      targets:
        ProbablySudoku: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuTests
    profile:
      config: Release
    archive:
      config: Release
  ProbablySudoku-Production:
    build:
      targets:
        ProbablySudoku: all
    # Running locally stays safe; only an explicit production archive uses live ads.
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablySudokuTests
    profile:
      config: Release
    archive:
      config: Production

packages:
  ProbablySudokuEngine:
    path: Engine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

targets:
  ProbablySudoku:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Artwork/studio-logo-horizontal.png
        buildPhase: resources
    entitlements:
      path: App/ProbablySudoku.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    dependencies:
      - package: ProbablySudokuEngine
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Probably Sudoku
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NumberClubAdMode: $(ADMOB_MODE)
        NumberClubRewardedAdUnitID: $(ADMOB_REWARDED_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # Without this iOS holds the app at 60Hz on a ProMotion phone.
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keep the existing portrait-only game layout in iPad compatibility mode.
        UIRequiresFullScreen: true
        # The app uses Apple GameKit/iCloud services, with no custom encryption.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        DEVELOPMENT_TEAM: 233268ZQDV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Regular device and TestFlight builds must not generate paid test traffic.
        ADMOB_MODE: test
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
      configs:
        Production:
          ADMOB_MODE: live
          ADMOB_APP_ID: ca-app-pub-6970700553304979~2878649005
          ADMOB_REWARDED_ID: ca-app-pub-6970700553304979/5201560013
          # Even a Production-config simulator build stays entirely on demo IDs.
          "ADMOB_MODE[sdk=iphonesimulator*]": test
          "ADMOB_APP_ID[sdk=iphonesimulator*]": ca-app-pub-3940256099942544~1458002511
          "ADMOB_REWARDED_ID[sdk=iphonesimulator*]": ca-app-pub-3940256099942544/1712485313
  ProbablySudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: ProbablySudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numberclub.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
