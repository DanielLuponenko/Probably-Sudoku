<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumberClub — Boss animations</title>
<style>
:root{color-scheme:light;--paper:#f3eddf;--ink:#202822;--sage:#476d61;--line:#c9ccbd;--muted:#586259}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:var(--sage)}header{padding:24px 32px 19px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}header h1{font:500 32px/1.1 Georgia,serif;margin:0}header p{margin:7px 0 0;color:var(--muted);font-size:14px}.workspace{display:grid;grid-template-columns:220px minmax(320px,1fr) 330px;max-width:1480px;margin:auto;height:calc(100dvh - 113px);min-height:570px}aside{padding:20px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}input{width:100%;border:1px solid var(--line);background:#fffaf1;border-radius:5px;padding:9px 10px;color:var(--ink)}nav{overflow:auto;margin-top:13px;display:flex;flex-direction:column;gap:2px}nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:4px;color:var(--ink);font-size:14px}nav button[aria-current=true]{background:var(--sage);color:#fff}nav button:hover:not([aria-current=true]){background:#e4e6d9}.stage{padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:0;background:#e6e7dc}.screen{display:flex;justify-content:center;align-items:center;flex:1;min-height:0;width:100%}video{display:block;max-width:100%;max-height:100%;height:100%;aspect-ratio:402/874;object-fit:contain;background:#f5eddf;border-radius:22px;box-shadow:0 9px 28px #23352b26}.screen{overflow:hidden;border-radius:14px}.screen.zoomed video{transform:scale(1.9);transform-origin:50% var(--focus,50%);border-radius:0}video:fullscreen{transform:none!important}.playback{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.playback button,select{border:1px solid #a5b4a8;border-radius:5px;padding:7px 10px;font-size:14px;background:#f8f5eb;color:var(--ink)}.playback button.primary{background:var(--sage);color:white;border-color:var(--sage)}.description{padding:27px 25px;overflow:auto}.position{font-size:13px;color:var(--muted)}h2{font:500 35px/1.08 Georgia,serif;margin:10px 0 14px}.rule{font-size:17px;margin:0 0 24px}.label{font-weight:650;margin:23px 0 5px;font-size:14px}.description p:not(.rule){font-size:14px}.description p{margin-top:5px;color:var(--muted)}.description .emphasis{color:var(--ink)}.clip-note{border-top:1px solid var(--line);margin-top:23px;padding-top:12px;font-size:12px;color:var(--muted)}.clip-note p{font-size:12px!important}.neighbors{display:flex;justify-content:space-between;gap:8px;margin-top:25px}.neighbors button{border:1px solid var(--line);border-radius:4px;background:transparent;padding:8px 12px;color:var(--ink)}.extras a{display:block;margin:8px 0;font-size:13px}.status{font-size:12px;color:var(--muted);max-width:480px;text-align:center;margin:0}.empty{display:none}noscript{padding:30px;display:block}@media(max-width:1080px){.workspace{grid-template-columns:190px minmax(290px,1fr) 260px}.description{padding:24px 18px}header{padding-inline:20px}h2{font-size:29px}}@media(max-width:790px){header{padding:18px;align-items:start}header h1{font-size:25px}header p{max-width:270px}header>a{font-size:13px}.workspace{height:auto;min-height:0;grid-template-columns:1fr}.workspace aside{padding:12px;border-right:0;border-bottom:1px solid var(--line)}nav{flex-direction:row;max-height:80px;white-space:nowrap;gap:5px}nav button{flex:0 0 auto}aside input{max-width:350px}.stage{height:75dvh;min-height:440px;padding:16px}.description{padding:25px;max-width:600px;margin:auto}.label{margin-top:15px}.clip-note{margin-top:18px}.neighbors{margin-bottom:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div><h1>Boss animations</h1><p>22 encounters, including six finales. Watch a real action, replay it, or slow it down.</p></div><a href="review.html">Earlier QA captures</a></header>
<main class="workspace">
<aside aria-label="Boss selection"><select id="roster" aria-label="Encounter roster" style="width:100%;margin-bottom:10px"><option value="active">Current roster · 22</option><option value="final">Final encounters · 6</option><option value="historical">Historical encounters</option></select><input id="search" type="search" placeholder="Find a boss" aria-label="Find a boss"><nav id="boss-list" aria-label="Bosses"></nav></aside>
<section class="stage" aria-label="Game recording">
<div class="screen"><video id="film" playsinline muted controls preload="metadata" aria-label="Boss animation recording"></video></div>
<div class="playback"><button class="primary" id="replay">Replay</button><button id="play-pause">Play</button><label for="speed">Speed</label><select id="speed"><option value="1">Normal</option><option value="0.5">½ speed</option><option value="0.25">¼ speed</option></select><button id="zoom" aria-pressed="false">Close-up</button><button id="loop" aria-pressed="false">Loop off</button></div>
<p class="status" id="status"></p>
</section>
<section class="description" aria-live="polite" aria-atomic="true">
<span class="position" id="position"></span><h2 id="name">Loading bosses…</h2><p class="rule" id="rule"></p>
<div class="label">On arrival</div><p id="entrance"></p>
<div class="label">When it acts</div><p class="emphasis" id="trigger"></p>
<div class="label">What stays visible</div><p id="persistent"></p>
<details class="clip-note"><summary>Recording details</summary><p id="demonstration"></p><p id="notes"></p></details>
<div class="extras" id="extras"></div>
<div class="neighbors"><button id="previous">← Previous</button><button id="next">Next →</button></div>
</section>
</main>
<noscript>Open the <a href="animation-inventory.json">complete animation inventory</a> or the <a href="review.html">screenshot gallery</a>.</noscript>
<script>
const $=id=>document.getElementById(id);let bosses=[],allBosses=[],clips={},current=0;const film=$('film');
const focus={censor:28,editor:88,deadline:94,critic:87,mirror:28,paywall:19,erratum:92,collector:42,heavyLifter:24,unluckyLucky:16,buffborger:16,sashimi:28,accountant:8,tikTak:26,handyDandy:87,galleyQueue:87,bookends:87,reprintBan:87,rebinder:87,lateCourier:89,collator:87,pageCutter:92,chainStitcher:28,returnSlip:87,orphanLine:28,serialPublisher:28,bindery:16,embargo:16,dryPress:26,reviewBoard:26,rivalColumn:28,royaltyContract:25,publicist:16,wordCount:28,backPage:28,collateral:30,splitEdition:30,lastEdition:30};
const oldClips={fog:{file:'native/fog-drift.mp4',demonstration:'Live Fog captured in the simulator.'},garryTheGray:{file:'native/garry-turn-change.mp4',demonstration:'A real Turn change releases the old bricks and drops the new set.'},overPusher:{file:'native/shredder-new-ink.mp4',demonstration:'A real Turn change adds new ink while earlier fouls remain.'},tikTak:{file:'native/tik-tak-last-minute-expiry.mp4',demonstration:'The real final minute, warning thresholds and timer expiry.'}};
function show(index,play=false){current=(index+bosses.length)%bosses.length;const b=bosses[current],c=clips[b.id]||oldClips[b.id];history.replaceState(null,'','#'+b.id);film.style.setProperty('--focus',(focus[b.id]||50)+'%');film.pause();film.removeAttribute('src');film.poster=c?.poster?(c.poster+'?v='+Math.floor(c.recordedAt||0)):(b.poster||'');if(c){film.src=c.file+'?v='+Math.floor(c.recordedAt||0);film.defaultPlaybackRate=film.playbackRate=Number($('speed').value);if(play)film.play().catch(()=>{});}else film.load();$('name').textContent=b.name;$('rule').textContent=b.rule;$('entrance').textContent=b.entrance;$('trigger').textContent=b.trigger;$('persistent').textContent=b.persistent;$('notes').textContent=[b.notes,c?.limitation].filter(Boolean).join(' ');$('demonstration').textContent=c?(c.demonstration+(!clips[b.id]?' Earlier QA build; see the native review for capture details.':'')):'Settled screenshot. A motion recording is not available for this boss.';$('status').textContent=c?'Actual game views on a QA board. Use Close-up or fullscreen for detail.':'Still image — this is not an animation recording.';$('position').textContent=(current+1)+' of '+bosses.length;$('replay').disabled=!c;for(const el of $('boss-list').children)el.setAttribute('aria-current',String(el.dataset.id===b.id));$('extras').replaceChildren();if(b.id==='tikTak'){addLink('Pause / resume recording','native/tik-tak-pause-proof.mp4');addLink('Full final-minute recording','native/tik-tak-last-minute-expiry.mp4');}addLink('Open this boss’s screenshot',c?.poster||b.poster);}
function addLink(label,href){if(!href)return;const a=document.createElement('a');a.textContent=label;a.href=href;a.target='_blank';$('extras').append(a)}
$('play-pause').onclick=()=>{if(film.paused)film.play().catch(()=>{});else film.pause();};for(const event of ['play','pause','ended'])film.addEventListener(event,()=>{$('play-pause').textContent=film.paused?'Play':'Pause';});
$('zoom').onclick=()=>{const active=document.querySelector('.screen').classList.toggle('zoomed');$('zoom').setAttribute('aria-pressed',String(active));$('zoom').textContent=active?'Full phone':'Close-up';};
$('replay').onclick=()=>{film.currentTime=0;film.play().catch(()=>{});};$('speed').onchange=()=>film.defaultPlaybackRate=film.playbackRate=Number($('speed').value);film.addEventListener('loadedmetadata',()=>{film.playbackRate=Number($('speed').value)});$('loop').onclick=()=>{film.loop=!film.loop;$('loop').textContent=film.loop?'Loop on':'Loop off';$('loop').setAttribute('aria-pressed',String(film.loop));};$('previous').onclick=()=>show(current-1,true);$('next').onclick=()=>show(current+1,true);$('search').oninput=()=>{const q=$('search').value.toLowerCase();for(const el of $('boss-list').children)el.hidden=!el.textContent.toLowerCase().includes(q)};

function renderRoster(preferredID){
 const choice=$('roster').value;
 bosses=allBosses.filter(b=>choice==='historical'?b.active===false:choice==='final'?b.active!==false&&b.tier==='final':b.active!==false);
 $('boss-list').replaceChildren();
 for(const b of bosses){const button=document.createElement('button');button.textContent=b.name;button.dataset.id=b.id;button.onclick=()=>show(bosses.indexOf(b),true);$('boss-list').append(button);}
 if(bosses.length)show(Math.max(0,bosses.findIndex(b=>b.id===preferredID)));
 $('search').dispatchEvent(new Event('input'));
}
$('roster').onchange=()=>renderRoster();
Promise.all([fetch('animation-inventory.json',{cache:'no-store'}).then(r=>r.json()),fetch('encounter-overview-metadata.json').then(r=>r.json()),fetch('animation-clips.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([list,shots,videos])=>{allBosses=list;clips=videos;for(const b of allBosses){const s=shots.find(s=>s.bossID===b.id);b.poster=s?'captures/'+s.image+'.png':'';}const id=location.hash.slice(1);if(allBosses.find(b=>b.id===id)?.active===false)$('roster').value='historical';renderRoster(id);}).catch(e=>{$('name').textContent='The review could not load.';$('rule').textContent=e.message;});
</script>
</body>
</html>
